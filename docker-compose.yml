services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_pass}
      POSTGRES_DB: ${POSTGRES_DB:-orca_db}
      PGPORT: ${POSTGRES_PORT:-5444}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5444}:${POSTGRES_PORT:-5444}"
    networks: [orca-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca} -d ${POSTGRES_DB:-orca_db} -p ${POSTGRES_PORT:-5444}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --port ${REDIS_PORT:-6381}
    ports:
      - "${REDIS_PORT:-6381}:${REDIS_PORT:-6381}"
    networks: [orca-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6381}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    profiles: ["ml"]
    command: mlflow server --host 0.0.0.0 --port 5001 --backend-store-uri /mlruns
    ports: ["5001:5001"]
    volumes: ["./mlruns:/mlruns"]
    networks: [orca-net]

  orca-ai:
    build:
      context: .
      dockerfile: ./apps/orca-ai/Dockerfile
    ports: ["8010:8010"]
    volumes:
      - "./data:/data"
      - "./mlruns:/mlruns"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8010}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-orca}:${POSTGRES_PASSWORD:-orca_pass}@postgres:${POSTGRES_PORT:-5444}/${POSTGRES_DB:-orca_db}}
      REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6381}}
      PREDICTION_CACHE_TTL_SECONDS: ${PREDICTION_CACHE_TTL_SECONDS:-900}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-orca-internal-local-token}
      PUBLIC_API_TOKEN: ${PUBLIC_API_TOKEN:-orca-public-local-token}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
      MODEL_PATH: ${MODEL_PATH:-/data/processed/model.lgbm}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5001}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-delay-predictor}
      MLFLOW_MODEL_STAGE: ${MLFLOW_MODEL_STAGE:-Staging}
      OPEN_METEO_API_URL: ${OPEN_METEO_API_URL:-https://api.open-meteo.com/v1/forecast}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      STADIA_API_KEY: ${STADIA_API_KEY:-}
      FONNTE_API_KEY: ${FONNTE_API_KEY:-}
      FONNTE_API_URL: ${FONNTE_API_URL:-https://api.fonnte.com/send}
      ALERT_RECIPIENT_PHONE: ${ALERT_RECIPIENT_PHONE:-}
      OSMNX_GRAPH_PATH: ${OSMNX_GRAPH_PATH:-/data/processed/osmnx/jabodetabek.graphml}
      OSMNX_PLACE_NAME: ${OSMNX_PLACE_NAME:-Jakarta, Indonesia}
      OSMNX_ENABLE_DOWNLOAD: ${OSMNX_ENABLE_DOWNLOAD:-false}
      ALERT_RISK_THRESHOLD: ${ALERT_RISK_THRESHOLD:-70.0}
      SLA_RISK_AMPLIFIER: ${SLA_RISK_AMPLIFIER:-4.0}
      DEMO_MODE: ${DEMO_MODE:-false}
      NSGA2_POPULATION_SIZE: ${NSGA2_POPULATION_SIZE:-50}
      NSGA2_GENERATIONS: ${NSGA2_GENERATIONS:-100}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [orca-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  orca-worker:
    build:
      context: .
      dockerfile: ./apps/orca-ai/Dockerfile
    command: arq worker.WorkerSettings
    volumes:
      - "./data:/data"
      - "./mlruns:/mlruns"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-orca}:${POSTGRES_PASSWORD:-orca_pass}@postgres:${POSTGRES_PORT:-5444}/${POSTGRES_DB:-orca_db}}
      REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6381}}
      MODEL_PATH: ${MODEL_PATH:-/data/processed/model.lgbm}
      OSMNX_GRAPH_PATH: ${OSMNX_GRAPH_PATH:-/data/processed/osmnx/jabodetabek.graphml}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [orca-net]

  orca-web:
    build:
      context: .
      dockerfile: ./apps/orca-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8010}
        NEXT_PUBLIC_POLL_INTERVAL_MS: ${NEXT_PUBLIC_POLL_INTERVAL_MS:-15000}
        NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN:-orca-public-local-token}
    ports: ["3010:3010"]
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8010}
      NEXT_PUBLIC_POLL_INTERVAL_MS: ${NEXT_PUBLIC_POLL_INTERVAL_MS:-15000}
      NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN:-orca-public-local-token}
    depends_on:
      orca-ai: {condition: service_healthy}
    networks: [orca-net]

  orca-migrate:
    image: orca-ai-open-innovation-orca-worker
    profiles: ["setup"]
    command: uv run python scripts/ingest/seed_db.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-orca}:${POSTGRES_PASSWORD:-orca_pass}@postgres:${POSTGRES_PORT:-5444}/${POSTGRES_DB:-orca_db}}
      REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6381}}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [orca-net]

volumes:
  postgres_data:

networks:
  orca-net:
    driver: bridge
